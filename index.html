<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiteForge AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070b;color:#fff;font-family:Arial,sans-serif}
main{max-width:1300px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;margin-bottom:20px}
.logo{font-size:22px;font-weight:800}.logo span{color:#9b7cff}.badge{color:#5eead4;font-size:11px;border:1px solid #5eead433;padding:8px;border-radius:20px}
.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.panel,.preview{background:#0d0d13;border:1px solid #ffffff12;border-radius:20px;padding:22px}
.preview{padding:10px;min-height:650px}h1{font-size:30px}p{color:#777;font-size:12px;line-height:1.6}
textarea{width:100%;height:260px;background:#08080d;color:#fff;border:1px solid #ffffff14;border-radius:14px;padding:15px;resize:none;margin:10px 0 12px;outline:none}
button{width:100%;padding:14px;border:0;border-radius:12px;color:#fff;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#8b5cf6,#06b6d4)}
button:disabled{opacity:.45}#status{font-size:11px;color:#aaa;min-height:18px;margin-top:12px}
iframe{width:100%;height:600px;border:0;border-radius:14px;background:white}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="top"><div class="logo">✦ SiteForge <span>AI</span></div><div class="badge">● REAL AI</div></div>
<div class="grid">
<section class="panel">
<h1>Создай настоящий сайт.</h1>
<p>Опиши идею — AI сгенерирует HTML, CSS и JavaScript, а результат появится справа.</p>
<textarea id="prompt" placeholder="Например: создай премиальный сайт автосалона Bugatti в чёрно-красном стиле, каталог, цены, характеристики и анимации"></textarea>
<button id="gen">✦ Сгенерировать сайт</button>
<div id="status">Готов к работе</div>
</section>
<section class="preview"><iframe id="view" sandbox="allow-scripts"></iframe></section>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
function status(t){$("#status").textContent=t}
function show(s){
  const safeJs=(s.js||"").replace(/<\/script/gi,"<\\/script");
  $("#view").srcdoc=`<!doctype html><html><head><meta charset="utf-8"><style>${s.css||""}</style></head><body>${s.html||""}<script>${safeJs}<\/script></body></html>`;
}
$("#gen").onclick=async()=>{
  const prompt=$("#prompt").value.trim();
  if(!prompt)return status("Напиши идею сайта");
  $("#gen").disabled=true; status("✦ AI создаёт сайт...");
  try{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Ошибка сервера");
    show(d.site); status("✓ Сайт создан AI");
  }catch(e){status("Ошибка: "+e.message)}
  finally{$("#gen").disabled=false}
};
</script>
</body>
</html>
